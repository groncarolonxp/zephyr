CONFIG_SECOND_CORE_MCUX=y

# Give the shared net_buf/net_pkt pools headroom: the real ENET also draws on
# them, and starving vnet0's RX allocation shows up as "RX alloc failed".
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

CONFIG_NET_ARP=y
