CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_ETHERNET_BRIDGE=y

# The ipc-ethernet driver (vnet0) is instantiated from the board overlay.
CONFIG_ETH_IPC=y
CONFIG_MBOX=y

CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y

CONFIG_MAIN_STACK_SIZE=4096
