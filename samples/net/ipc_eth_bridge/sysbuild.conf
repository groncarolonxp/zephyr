#
# Sysbuild configuration for the ipc_eth_bridge sample (cpu0 host). This
# selects which stock Zephyr application is built as the "remote" (cpu1)
# image over the IPC virtual Ethernet (vnet0).
#
# Toggle the remote app by commenting/uncommenting one of the lines below.
# The default (if this file is absent or both are commented) is the stock
# sockets/echo_server, as declared in Kconfig.sysbuild.
#
# - echo_server: answers on UDP and TCP port 4242 (functional / loopback test)
# - zperf:       throughput benchmark server (stress / performance test)

# Remote = echo_server (default behaviour).
#SB_CONFIG_REMOTE_APP_SOURCE_DIR="${ZEPHYR_BASE}/samples/net/sockets/echo_server"

# Remote = zperf (uncomment to run the throughput test on cpu1).
SB_CONFIG_REMOTE_APP_SOURCE_DIR="${ZEPHYR_BASE}/samples/net/zperf"
