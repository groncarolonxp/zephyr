# Run the STOCK echo_server sample on cpu1 over the IPC virtual Ethernet
# (vnet0). No application source changes: the ipc-ethernet driver
# (instantiated by the board overlay) provides the interface, brings its own
# carrier up on the peer handshake, and NET_CONFIG assigns the IPv4 address
# below. echo_server answers on both UDP and TCP port 4242.

CONFIG_SECOND_CORE_MCUX=y
CONFIG_MBOX=y

# The ipc-ethernet driver is auto-enabled by the DT node; be explicit.
CONFIG_ETH_IPC=y

# IPv4 only: cpu1 has 64 KB RAM, so drop echo_server's default IPv6 to fit.
CONFIG_NET_IPV6=n
CONFIG_NET_CONFIG_NEED_IPV6=n

# IPv4 addressing for cpu1 (remote == 192.0.2.1).
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# Multiple IPv4-capable interfaces may exist (real ENET plus vnet0); allow the
# address to be placed and let the driver's carrier decide reachability.
CONFIG_NET_IF_MAX_IPV4_COUNT=4
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=4

# Modest net_buf/net_pkt pools: cpu1 RAM is tight (64 KB).
CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_PKT_TX_COUNT=6
CONFIG_NET_BUF_RX_COUNT=10
CONFIG_NET_BUF_TX_COUNT=10

# Trim further to fit 64 KB RAM.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_MAX_CONTEXTS=6

# Logs so the handshake / carrier transitions are visible.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
