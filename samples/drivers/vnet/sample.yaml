sample:
  name: Virtual network device (cross-core vnet)
common:
  sysbuild: true
  tags: net mbox
  timeout: 30
tests:
  sample.drivers.vnet.vnet:
    filter: dt_compat_enabled("zephyr,ipc-ethernet")
    platform_allow:
      - mimxrt1180_evk/mimxrt1189/cm33
      - frdm_mcxn947/mcxn947/cpu0
      - mcx_n9xx_evk/mcxn947/cpu0
    integration_platforms:
      - frdm_mcxn947/mcxn947/cpu0
    harness: console
    harness_config:
      type: multi_line
      ordered: false
      regex:
        - "VNET: \\[TX\\] sent .*"
        - "VNET: \\[RX\\] received .*"
