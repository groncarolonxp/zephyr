CONFIG_SECOND_CORE_MCUX=y

# Virtual Ethernet over shared memory + MBOX doorbell, provided by the in-tree
# zephyr,ipc-ethernet driver (CONFIG_ETH_IPC). This core (cpu1) is the
# "remote": the role, shared-block address and mailbox channels come from the
# vnet0 devicetree node in the board overlay.
CONFIG_ETH_IPC=y

# Sample UDP demo on top of vnet0.
CONFIG_VNET=y
# Send the demo datagrams to BOTH the host core (cpu0, 192.0.2.2) over the
# shared-memory ring AND the off-chip PC (192.0.2.10, reachable via the host
# core's vnet0<->Ethernet bridge). This makes cpu1 a full endpoint that talks
# to both of the other two peers each cycle.
CONFIG_VNET_DEMO_PEER_ADDR="192.0.2.2,192.0.2.10"

CONFIG_MBOX=y

# Console on cpu1.
CONFIG_STDOUT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Logging: synchronous so the vnet driver messages print immediately.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# Network stack: IPv4 + UDP sockets.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16

CONFIG_NET_ARP=y
CONFIG_MAIN_STACK_SIZE=4096

# Allow multiple IPv4-capable interfaces so the address can be placed on vnet0.
CONFIG_NET_IF_MAX_IPV4_COUNT=4
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=4

# The net stack needs a source of randomness (ephemeral ports, etc).
CONFIG_TEST_RANDOM_GENERATOR=y

# vnet demo: bind socket to vnet0 explicitly.
CONFIG_NET_INTERFACE_NAME=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=n
CONFIG_NET_IPV4_ACD=n
